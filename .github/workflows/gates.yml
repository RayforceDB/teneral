# What a mutation must pass, run on every pull request's head, so the human who merges sees it beside
# the change. Nothing here has a secret, and nothing here merges: see README, "Offering a change
# to the species". The workflow that runs is the pull request's own, as its code and its tests are.
name: gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: the gates, on the pull request's head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The tests make commits in repositories of their own.
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: bun install --frozen-lockfile
      - name: types
        run: bun x tsc --noEmit
      - name: the kernel's tests
        run: bun test test/kernel
      - name: the body's tests
        run: bun test test/body
      # Once more as the kernel itself runs them on a candidate, in a fresh checkout with a bare
      # environment, ending with the smoke run: the body is started against a stand-in for the model.
      - name: the gates as the kernel runs them, smoke run included
        run: bun kernel/offer.ts gates HEAD

  paths:
    name: paths outside what a mutation may change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # A report, not a verdict: it never fails. The list is kernel/protected.ts, and a test keeps the two the same.
      - name: report them
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CHANGEABLE: '^(body/|test/body/|BACKLOG\.md$)'
        run: |
          outside="$(git -c core.quotePath=false diff --name-only --no-renames "$(git merge-base "$BASE" HEAD)" HEAD | grep -v -E "$CHANGEABLE" || true)"
          if [ -z "$outside" ]; then
            echo "This pull request changes only what a mutation may change: body/, test/body/ and BACKLOG.md." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            count="$(printf '%s\n' "$outside" | wc -l | tr -d ' ')"
            echo "::warning title=Outside the body::This pull request changes $count path(s) a mutation could not: the kernel, its tests or the project's own files."
            {
              echo "### This pull request changes $count path(s) outside the body"
              echo "A mutation could not make these changes: the kernel, its tests, the project's own files."
              echo
              printf '%s\n' "$outside" | sed 's/^/- `/; s/$/`/'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
